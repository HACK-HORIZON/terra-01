name: Automated Model Training & Fine-Tuning

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of epochs to train'
        required: true
        default: '25'
      learning_rate:
        description: 'Learning rate (fine-tuning recommended: 1e-4)'
        required: true
        default: '0.0001'
      batch_size:
        description: 'Batch size'
        required: true
        default: '8'
      fresh:
        description: 'Train from scratch instead of warm-starting from current weights?'
        type: boolean
        default: false
  schedule:
    # Run automatically every Sunday at midnight UTC
    - cron: '0 0 * * 0'

jobs:
  train-orbital-hybrid-net:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare and augment dataset
        run: |
          python Frontend/prepare_dataset.py

      - name: Run Model Training / Fine-Tuning
        run: |
          FRESH_FLAG=""
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then
            FRESH_FLAG="--fresh"
          fi
          
          python backend/train.py \
            --data_dir ./Frontend/dataset \
            --epochs ${{ github.event.inputs.epochs || '20' }} \
            --lr ${{ github.event.inputs.learning_rate || '0.0001' }} \
            --batch_size ${{ github.event.inputs.batch_size || '8' }} \
            --save_interval 5 \
            $FRESH_FLAG

      - name: Commit and push updated model weights
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/model/weights/orbital_hybrid_net.pth
          if git diff --staged --quiet; then
            echo "No changes in model weights."
          else
            git commit -m "chore(model): auto-trained updated OrbitalHybridNet weights [skip ci]"
            git push
          fi
