services:
  - type: web
    name: terra-01-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
